# AntiBitch CI/CD Pipeline
# 使用 Maven 构建 Java 项目，矩阵构建两个 Minecraft 版本产物并上传

name: Build

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.profile }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        profile: [ '26.2', '1.21.11' ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Verify Maven configuration
      run: mvn -v

    - name: Build with Maven (${{ matrix.profile }})
      run: mvn -B clean package -P ${{ matrix.profile }} --file pom.xml

    - name: Run tests (if any)
      run: mvn test -P ${{ matrix.profile }}
      continue-on-error: true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v5
      with:
        name: AntiBitch-${{ matrix.profile }}
        path: target/AntiBitch-*.jar
        retention-days: 7

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Download artifacts
      uses: actions/download-artifact@v5
      with:
        path: artifacts

    - name: Display structure of downloaded files
      run: ls -R artifacts

    - name: Collect jars and generate checksums
      run: |
        mkdir -p release
        find artifacts -name '*.jar' -exec cp {} release/ \;
        cd release
        sha256sum *.jar > SHA256SUMS.txt

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          release/*.jar
          release/SHA256SUMS.txt
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
